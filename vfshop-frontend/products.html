
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VF SHOP - Product Management</title>
    <link rel="stylesheet" href="products.css">
</head>
<body>

    <aside class="sidebar">
        <h2>🌱 VF SHOP</h2>

        <nav>
            <a href="admin.html">📊 Dashboard</a>
            <a href="admin.html">📦 Orders</a>
            <a href="customers.html">👥 Customers</a>
            <a href="products.html" class="active">🛒 Products</a>
        </nav>

        <a href="login.html" class="logout">🚪 Logout</a>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <div>
                <h1>Product Management</h1>
                <p>Manage your VF SHOP products</p>
            </div>

            <button id="refresh-btn">↻ Refresh</button>
        </header>

        <section class="stats-container">
            <div class="stat-card">
                <div class="stat-icon">🛒</div>
                <div>
                    <p>Total Products</p>
                    <h2 id="total-products">0</h2>
                </div>
            </div>
        </section>

        <section class="form-section">
            <h2 id="form-title">Add New Product</h2>

            <form id="product-form">

                <input type="hidden" id="product-id">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="product-name">Product Name</label>
                        <input
                            type="text"
                            id="product-name"
                            placeholder="Enter product name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="product-price">Price (₹)</label>
                        <input
                            type="number"
                            id="product-price"
                            placeholder="Enter price"
                            min="0.01"
                            step="0.01"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="product-image">Image Path</label>
                        <input
                            type="text"
                            id="product-image"
                            placeholder="assets/apple.jpg"
                        >
                    </div>

                    <div class="form-group">
                        <label for="product-description">Description</label>
                        <input
                            type="text"
                            id="product-description"
                            placeholder="Enter description"
                        >
                    </div>

                </div>

                <div class="form-buttons">
                    <button type="submit" id="save-btn">Add Product</button>
                    <button type="button" id="cancel-btn" class="cancel-btn">
                        Clear
                    </button>
                </div>

            </form>
        </section>

        <section class="products-section">

            <div class="section-header">
                <div>
                    <h2>All Products</h2>
                    <p>View, edit and delete products</p>
                </div>

                <input
                    type="text"
                    id="search-product"
                    placeholder="Search products..."
                >
            </div>

            <div id="message"></div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Image</th>
                            <th>Product Name</th>
                            <th>Price</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="products-table-body">
                        <tr>
                            <td colspan="6">Loading products...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </section>

    </main>

    <script src="products.js"></script>

</body>
</html>
