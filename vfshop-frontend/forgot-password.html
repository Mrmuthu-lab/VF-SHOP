
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VF SHOP | Forgot Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="auth-layout">

    <section class="visual-panel">
        <div class="brand">
            <span class="brand-mark">VF</span>
            <span>VF SHOP</span>
        </div>

        <div class="visual-copy">
            <p class="eyebrow">ACCOUNT SECURITY</p>
            <h1>Fresh start.<br>New password.</h1>
            <p>Reset your password and continue shopping fresh.</p>
        </div>

        <div class="visual-note">Naturally fresh. Always delicious.</div>
    </section>

    <section class="form-panel">
        <div class="mobile-brand">
            <span class="brand-mark">VF</span>
            <span>VF SHOP</span>
        </div>

        <div class="form-wrap">

            <p class="eyebrow green">PASSWORD RECOVERY</p>
            <h2 id="stepTitle">Forgot Password?</h2>
            <p class="muted" id="stepDescription">
                Enter your registered email to receive an OTP.
            </p>

            <!-- STEP 1 -->
            <form id="emailForm">

                <label>Email address</label>
                <input type="email" id="email"
                       placeholder="you@example.com" required>

                <p id="message1" class="message"></p>

                <button class="primary-btn" type="submit" id="sendBtn">
                    Send OTP
                </button>
            </form>

            <!-- STEP 2 -->
            <form id="otpForm" style="display:none;">

                <label>Enter OTP</label>
                <input type="text" id="otp"
                       placeholder="6-digit OTP"
                       maxlength="6" inputmode="numeric" required>

                <p id="message2" class="message"></p>

                <button class="primary-btn" type="submit">
                    Verify OTP
                </button>
            </form>

            <!-- STEP 3 -->
            <form id="resetForm" style="display:none;">

                <label>New Password</label>
                <input type="password" id="newPassword"
                       placeholder="Enter new password"
                       minlength="8" required>

                <label>Confirm Password</label>
                <input type="password" id="confirmPassword"
                       placeholder="Confirm new password"
                       minlength="8" required>

                <p id="message3" class="message"></p>

                <button class="primary-btn" type="submit">
                    Reset Password
                </button>
            </form>

            <p class="switch-text">
                Remember your password?
                <a href="login.html">Login</a>
            </p>

        </div>
    </section>

</main>

<script src="forgot-password.js"></script>

</body>
</html>
