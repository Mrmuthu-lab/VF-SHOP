<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - VF SHOP</title>
    <link rel="stylesheet" href="style.css">

    <style>
        /* =====================================
   PROFILE PAGE NAVBAR
===================================== */

        .navbar {
            width: 100%;
            min-height: 75px;
            padding: 0 6%;
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-sizing: border-box;
        }

        .navbar .logo {
            font-size: 25px;
            font-weight: 800;
            color: #198754;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-size: 15px;
            font-weight: 600;
            transition: 0.3s ease;
            padding: 10px 0;
            position: relative;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #198754;
        }

        .nav-links a.active::after,
        .nav-links a:hover::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 3px;
            width: 100%;
            height: 2px;
            background: #198754;
            border-radius: 5px;
        }

        /* MOBILE RESPONSIVE */

        @media (max-width: 768px) {

            .navbar {
                flex-direction: column;
                padding: 15px;
                gap: 15px;
            }

            .nav-links {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
                gap: 12px 20px;
            }

            .nav-links a {
                font-size: 13px;
            }
        }

        .profile-section {
            padding: 40px 20px;
            min-height: 80vh;
        }

        .profile-container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.1);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .profile-image {
            width: 75px;
            height: 75px;
            background: #e8f5e9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
        }

        .profile-content h2,
        .account-actions h2 {
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-group {
            flex: 1;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        .profile-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .profile-buttons button,
        .logout-btn {
            padding: 12px 22px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            text-decoration: none;
        }

        .save-btn {
            background: #198754;
            color: white;
        }

        .cancel-btn {
            background: #ddd;
            color: #222;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .action-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px;
            border: 1px solid #ddd;
            border-radius: 10px;
            text-decoration: none;
            color: #222;
        }

        .action-card:hover {
            background: #f1f8f2;
        }

        .logout-section {
            margin-top: 25px;
        }

        .logout-btn {
            display: inline-block;
            background: #dc3545;
            color: white;
        }

        #profile-save-msg {
            margin-top: 15px;
            font-weight: bold;
        }

        @media(max-width: 600px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .profile-container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">🌱 VF SHOP</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="product.html">Products</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
            <a href="cart.html">🛒 Cart</a>
            <a href="profile.html" class="active">👤 Profile</a>
        </div>
    </nav>

    <section class="profile-section">

        <div class="profile-container">

            <div class="profile-header">
                <div class="profile-image">👤</div>

                <div class="profile-title">
                    <h1>My Profile</h1>
                    <p>Manage your VF SHOP account</p>
                </div>
            </div>

            <div class="profile-content">

                <h2>Personal Information</h2>

                <form id="profileForm">

                    <div class="form-row">

                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" name="name" placeholder="Enter your name" required>
                        </div>

                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" name="email" readonly>
                        </div>

                    </div>

                    <div class="form-row">

                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="tel" name="phone" placeholder="Enter phone number" pattern="[0-9]{10}"
                                maxlength="10">
                        </div>

                        <div class="form-group">
                            <label>Pincode</label>
                            <input type="text" name="pincode" placeholder="Enter pincode" pattern="[0-9]{6}"
                                maxlength="6">
                        </div>

                    </div>

                    <div class="form-group">
                        <label>Address</label>
                        <textarea name="address" placeholder="Enter delivery address" rows="3"></textarea>
                    </div>

                    <div class="form-group">
                        <label>City</label>
                        <input type="text" name="city" placeholder="Enter city">
                    </div>

                    <div class="profile-buttons">

                        <button type="button" id="editBtn" class="cancel-btn">
                            ✏️ Edit Profile
                        </button>

                        <button type="submit" id="saveBtn" class="save-btn" disabled>
                            💾 Save Changes
                        </button>

                        <button type="reset" id="cancelBtn" class="cancel-btn" hidden>
                            Cancel
                        </button>

                    </div>

                </form>

                <p id="profile-save-msg"></p>

            </div>

            <hr>

            <div class="account-actions">

                <h2>My Account</h2>

                <div class="action-buttons">

                    <a href="order-history.html" class="action-card">
                        📦
                        <div>
                            <h3>My Orders</h3>
                            <p>View your previous orders</p>
                        </div>
                    </a>



                </div>

            </div>

            <div class="logout-section">
                <button type="button" id="logoutBtn" class="logout-btn">
                    🚪 Logout
                </button>
            </div>

        </div>

    </section>

    <footer>
        <p>© 2026 VF SHOP. Freshness Delivered to Your Doorstep 🌱</p>
    </footer>

    <script src="profile.js"></script>

</body>

</html>
